<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Room</title>
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />

    <!--
      This file exists so the room works no matter how GitHub Pages is set up.

        * Source: GitHub Actions    the workflow publishes web/ as the site root
                                    and this file is not part of the upload.
        * Source: Deploy from a branch
                                    the whole repository is published, so the
                                    site root is this file. Without it, Jekyll
                                    renders README.md as the homepage — which
                                    looks like the app failed to deploy.

      Either way, opening the site lands you in the chat room.
    -->
    <meta http-equiv="refresh" content="0; url=./web/" />
    <link rel="canonical" href="./web/" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #14161a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto,
          Helvetica, Arial, sans-serif;
      }
      a {
        color: #14161a;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      p {
        color: #5c6270;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p>Opening the chat room… <a href="./web/">Continue</a></p>
    <script>
      // Runs before the meta refresh in practice, and keeps the URL tidy.
      window.location.replace('./web/');
    </script>
  </body>
</html>
